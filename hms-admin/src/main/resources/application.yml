# 项目相关配置
ruoyi:
  # 名称
  name: HMS
  # 版本
  version: 3.8.8
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ./uploadPath
  # 获取ip地址开关
  addressEnabled: true
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.hms: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: prod
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 500MB
      # 设置总上传的文件大小
      max-request-size: 500MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关,memo by CYQ 2025年8月29日 这里写成true会导致改完代码自动重启
      enabled: false
  # redis 配置
  redis:
    # 地址
    host: ${REDIS_HOST:localhost}
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password: ${REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
  mail:
    host: smtp.163.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${TOKEN_SECRET:abcdefghijklmnopqrstuvwxyz}
  # 令牌有效期（PC端，默认30分钟）
  expireTime: 30
  # 令牌有效期（移动端，7天）
  expireTimeMobile: 10080

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.hms.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# AI 服务商配置
ai:
  # 通义千问（DashScope）
  qwen:
    apiUrl: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
    # 深度思考模型：qwq-plus;更便宜的模型：qwen-flash;角色扮演模型：qwen-plus-character
    model: qwen3.7-max-preview
    apiKey: ${QWEN_API_KEY:}
  # OpenCode Go 代理（需携带 x-opencode-session，代码已自动处理）
  opencode-go:
    apiUrl: https://opencode.ai/zen/go/v1/chat/completions
    # 多模态/文本模型统一走这里；qwen3.8-flash 图文/视频均可，单价低（$0.15/$0.47），
    # 实测 22MB 八段锦视频单次约 40~45s 稳定识别；注意并发调用会触发上游多媒体下载超时
    # update by CYQ 2026-10-19 由 deepseek-v4.1-flash（大视频会静默忽略视频内容）更换
    model: qwen3.8-flash
    # update by CYQ 2026-10-19 旧 key 过期，更换为新版 oc_sk_ key
    apiKey: ${OPENCODE_GO_API_KEY:}
  # 本地 Ollama 服务
  ollama:
    host: http://localhost:11434
    model: qwen3.5:9b

# add by CYQ 2026-11-02 淘宝客转链模块
# UniPush 2.0 推送配置（直调 DCloud OpenAPI）
# OpenAPI密钥获取: dev.dcloud.net.cn → 应用详情 → OpenAPI密钥
unipush:
  app-id: __UNI__73E64E4
  space-id: ${UNIPUSH_SPACE_ID:}
  function-url: ${UNIPUSH_FUNCTION_URL:}

# veighNa 量化交易模块路径（生产环境下 user.dir 可能不是项目目录，需显式配置）
veighNa:
  # 留空则自动探测（先 user.dir+/veighNa，再 user.dir+/../veighNa）
  path:

# 邮箱参数
mail:
  we: ${MAIL_TO:user@example.com}
  me: ${MAIL_FROM:user@example.com}
  mailkey: ${MAIL_KEY:}

wx:
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}
  url: https://api.weixin.qq.com/
  toUser: ${WX_TO_USER:}
  templateId: ${WX_TEMPLATE_ID:}

  # 微信小程序订阅消息
  miniapp:
    appid: ${WX_MINIAPP_APPID:}
    secret: ${WX_MINIAPP_SECRET:}
    template-id: ${WX_MINIAPP_TEMPLATE_ID:}

# 新用户自动分配生活管家全权角色（移动端/PC 共用 /register 接口）
hms:
  register:
    life-butler-auto-assign: true
    life-butler-role-keys: shgjqq

# Arthas 诊断工具配置
arthas:
  # 是否启用（生产环境建议通过启动参数动态开启）
  enabled: true
  # agent id，集群中需要唯一
  agent-id: hms-${server.port}
  # telnet 端口，默认 3658
  #  telnet-port: 3658
  # HTTP 端口，默认 8563
  #  http-port: 8563
  # IP 绑定
  ip: 0.0.0.0
  #  ip: 36.112.200.0
  username: hms
  password: hms
  # MCP 地址
  mcpEndpoint: /mcp
