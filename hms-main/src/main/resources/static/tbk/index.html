<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>省钱转链 · 隐藏优惠券</title>
<style>
  :root{
    --primary:#ff5000;
    --primary-dark:#e63f00;
    --text:#1f2329;
    --sub:#8a9099;
    --line:#eef0f3;
    --bg:#f5f6f8;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.5;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .page{max-width:560px;margin:0 auto;padding:0 16px 32px;}

  header{padding:28px 4px 20px;}
  .logo{
    width:44px;height:44px;border-radius:13px;
    background:linear-gradient(135deg,#ff7a3d,#ff3d00);
    color:#fff;font-size:23px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px rgba(255,61,0,.28);
    margin-bottom:14px;
  }
  header h1{font-size:23px;line-height:1.25;margin:0 0 6px;letter-spacing:.5px;}
  header p{margin:0;color:var(--sub);font-size:13px;}

  .card{
    background:#fff;border-radius:var(--radius);
    padding:18px;margin-bottom:14px;
    box-shadow:0 2px 10px rgba(20,25,40,.04);
  }

  .label{display:block;font-size:13px;color:var(--sub);margin-bottom:8px;}
  textarea{
    width:100%;min-height:104px;resize:vertical;
    border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:14px;line-height:1.6;
    font-family:inherit;color:var(--text);
    background:#fafbfc;outline:none;
    transition:border-color .2s,background .2s;
  }
  textarea:focus{border-color:#ffb08f;background:#fff;}
  textarea::placeholder{color:#b6bcc5;}

  .row{display:flex;gap:10px;margin-top:10px;}
  .row > button{flex:1;}

  button{
    border:0;border-radius:12px;font-family:inherit;
    font-size:15px;font-weight:500;cursor:pointer;
    transition:transform .12s,opacity .2s,background .2s;
  }
  button:active{transform:scale(.975);}
  button:disabled{opacity:.55;cursor:not-allowed;}

  .ghost{
    padding:10px 0;background:#f4f6f8;color:#5b6370;font-size:13.5px;
  }
  .primary{
    width:100%;padding:15px 0;margin-top:14px;
    background:linear-gradient(135deg,#ff6a2a,#ff3d00);
    color:#fff;font-size:16px;font-weight:600;
    box-shadow:0 8px 18px rgba(255,61,0,.22);
  }
  .primary:disabled{box-shadow:none;}

  /* 结果卡片 */
  .result-top{display:flex;gap:12px;}
  .thumb{
    width:88px;height:88px;border-radius:12px;flex:0 0 auto;
    background:#f2f4f7 center/cover no-repeat;
    display:flex;align-items:center;justify-content:center;
    color:#c3c8d0;font-size:28px;overflow:hidden;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .info{min-width:0;flex:1;}
  .title{
    font-size:14px;line-height:1.45;margin:0 0 8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .price-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .final{color:var(--primary);font-size:24px;font-weight:700;letter-spacing:-.5px;}
  .final small{font-size:13px;font-weight:600;margin-right:1px;}
  .original{color:#a8aeb8;font-size:13px;text-decoration:line-through;}
  .badge{
    display:inline-block;background:#fff2ec;color:var(--primary);
    font-size:11.5px;padding:2px 7px;border-radius:6px;margin-left:2px;
  }
  .coupon-info{margin-top:6px;font-size:12px;color:var(--primary);}

  .metrics{
    display:flex;gap:8px;margin:14px 0 0;
    padding-top:14px;border-top:1px dashed var(--line);
  }
  .metric{flex:1;text-align:center;}
  .metric b{display:block;font-size:16px;color:#2b3038;}
  .metric span{font-size:11.5px;color:var(--sub);}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .actions .full{grid-column:1 / -1;}
  .btn-line{
    padding:12px 0;background:#fff;border:1px solid #ffd2c2;color:var(--primary);
    font-size:14px;font-weight:600;
  }
  .btn-solid{
    padding:12px 0;background:#fff3ee;color:var(--primary);
    font-size:14px;font-weight:600;
  }
  .btn-dark{
    padding:12px 0;background:#2b3038;color:#fff;font-size:14px;font-weight:600;
  }

  .notice{
    margin-top:12px;padding:10px 12px;border-radius:10px;
    background:#fff8ed;color:#a2711f;font-size:12px;line-height:1.5;
  }

  /* 历史 */
  .history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .history-head span{font-size:13px;color:var(--sub);}
  .history-head button{background:none;color:#b6bcc5;font-size:12.5px;padding:4px;}
  .history-item{
    display:flex;justify-content:space-between;gap:12px;
    padding:11px 0;border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .history-item:last-child{border-bottom:0;padding-bottom:0;}
  .history-item .h-title{
    font-size:13px;color:#3a4048;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .history-item .h-time{font-size:11.5px;color:#b0b6bf;margin-top:2px;}
  .history-item .h-price{font-size:13px;color:var(--primary);font-weight:600;white-space:nowrap;}

  footer{text-align:center;color:#b0b6bf;font-size:11.5px;padding:8px 0 0;line-height:1.7;}

  .toast{
    position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom));
    transform:translate(-50%,16px);
    background:rgba(30,34,40,.92);color:#fff;
    padding:10px 18px;border-radius:22px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:all .22s;z-index:99;
    max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .hidden{display:none !important;}

  .spinner{
    display:inline-block;width:15px;height:15px;
    border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
    border-radius:50%;animation:spin .7s linear infinite;
    vertical-align:-2px;margin-right:7px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo">省</div>
    <h1>淘宝 / 拼多多优惠转链</h1>
    <p>粘贴商品分享文案或链接，立即获取隐藏优惠券</p>
  </header>

  <section class="card">
    <label class="label" for="content">粘贴淘宝 / 拼多多分享文案</label>
    <textarea id="content" placeholder="请粘贴商品分享的完整文案（淘宝需含「商品标题」）：&#10;【淘宝】https://e.tb.cn/h.xxxxxx CZ009 「商品标题」&#10;【拼多多】https://p.pinduoduo.com/xxxxx&#10;也可以直接粘贴拼多多商品链接"></textarea>
    <div class="row">
      <button class="ghost" id="pasteBtn" type="button">读取剪贴板</button>
      <button class="ghost" id="clearBtn" type="button">清空</button>
    </div>
    <button class="primary" id="convertBtn" type="button">立即转换</button>
  </section>

  <section class="card hidden" id="resultCard"></section>

  <section class="card hidden" id="historyCard">
    <div class="history-head">
      <span>最近转换</span>
      <button id="clearHistoryBtn" type="button">清空</button>
    </div>
    <div id="historyList"></div>
  </section>

  <footer>
    支持淘宝 / 天猫 / 拼多多商品<br>
    优惠券数量有限，随时可能失效<br>
    返利为预估金额，以平台实际结算为准
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var API = 'api/convert';
  var HISTORY_KEY = 'tbk_convert_history_v1';
  var MAX_HISTORY = 10;

  var $content = document.getElementById('content');
  var $convertBtn = document.getElementById('convertBtn');
  var $resultCard = document.getElementById('resultCard');
  var $historyCard = document.getElementById('historyCard');
  var $historyList = document.getElementById('historyList');
  var $toast = document.getElementById('toast');
  var toastTimer = null;
  var current = null;
  var loading = false;

  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $toast.classList.remove('show'); }, 1800);
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function money(v) {
    if (v === null || v === undefined || v === '') return '--';
    var n = Number(v);
    if (isNaN(n)) return String(v);
    return n.toFixed(2).replace(/\.00$/, '');
  }

  function copyText(text, tip) {
    if (!text) { toast('没有可复制的内容'); return; }
    var done = function () { toast(tip || '已复制'); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-9999px;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); }
    catch (e) { toast('复制失败，请长按手动复制'); }
    document.body.removeChild(ta);
  }

  function setLoading(on) {
    loading = on;
    $convertBtn.disabled = on;
    $convertBtn.innerHTML = on ? '<span class="spinner"></span>正在转换…' : '立即转换';
  }

  function getUserKey() {
    var key = 'tbk_h5_user_key';
    var value = localStorage.getItem(key);
    if (!value) {
      value = 'h5' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      localStorage.setItem(key, value);
    }
    return value;
  }

  function convert() {
    var content = $content.value.trim();
    if (!content) { toast('请先粘贴商品分享文案或链接'); return; }
    if (loading) return;

    setLoading(true);
    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: content, userKey: getUserKey() })
    })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (!json || json.code !== 200) {
          throw new Error((json && json.msg) || '转换失败');
        }
        current = json.data;
        renderResult(current);
        addHistory(content, current);
        $resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      })
      .catch(function (err) {
        toast(err && err.message ? err.message : '转换失败，请稍后重试');
      })
      .finally(function () { setLoading(false); });
  }

  function renderResult(d) {
    var pic = d.picUrl
      ? '<img src="' + escapeHtml(d.picUrl) + '" alt="" referrerpolicy="no-referrer">'
      : '<span>🛍</span>';

    var save = (d.originalPrice != null && d.finalPrice != null)
      ? Math.max(0, Number(d.originalPrice) - Number(d.finalPrice)) : 0;

    var html = ''
      + '<div class="result-top">'
      +   '<div class="thumb">' + pic + '</div>'
      +   '<div class="info">'
      +     '<p class="title">' + escapeHtml(d.title || '商品') + '</p>'
      +     '<div class="price-line">'
      +       '<span class="final"><small>¥</small>' + money(d.finalPrice) + '</span>'
      +       (d.originalPrice ? '<span class="original">¥' + money(d.originalPrice) + '</span>' : '')
      +       (d.couponAmount ? '<span class="badge">券 ¥' + money(d.couponAmount) + '</span>' : '')
      +     '</div>'
      +     (d.couponInfo ? '<div class="coupon-info">' + escapeHtml(d.couponInfo) + '</div>' : '')
      +   '</div>'
      + '</div>'
      + '<div class="metrics">'
      +   '<div class="metric"><b>' + (save ? money(save) : '--') + '</b><span>本单可省(元)</span></div>'
      +   '<div class="metric"><b>' + (d.cashbackAmount != null ? '¥' + money(d.cashbackAmount) : '--') + '</b><span>预估返利</span></div>'
      +   '<div class="metric"><b>' + (d.itemId ? escapeHtml(String(d.itemId).slice(-6)) : '--') + '</b><span>商品编号</span></div>'
      + '</div>'
      + '<div class="actions">'
      +   (d.tpwd ? '<button class="btn-solid" id="copyTpwdBtn" type="button">复制淘口令</button>' : '')
      +   (d.shortUrl ? '<button class="btn-line" id="openLinkBtn" type="button">打开购买链接</button>' : '')
      +   '<button class="btn-dark full" id="copyAllBtn" type="button">复制完整文案</button>'
      + '</div>'
      + (d.notice ? '<div class="notice">' + escapeHtml(d.notice) + '</div>' : '');

    $resultCard.innerHTML = html;
    $resultCard.classList.remove('hidden');

    var $tpwd = document.getElementById('copyTpwdBtn');
    if ($tpwd) $tpwd.onclick = function () {
      copyText(d.tpwd, '淘口令已复制，打开淘宝即可');
    };
    var $open = document.getElementById('openLinkBtn');
    if ($open) $open.onclick = function () { window.open(d.shortUrl, '_blank'); };
    document.getElementById('copyAllBtn').onclick = function () {
      copyText(d.copyText || (d.tpwd + ' ' + (d.shortUrl || '')), '文案已复制，可直接发送');
    };
  }

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]') || []; }
    catch (e) { return []; }
  }

  function saveHistory(list) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, MAX_HISTORY))); } catch (e) {}
  }

  function addHistory(content, d) {
    var list = loadHistory().filter(function (item) { return item.content !== content; });
    list.unshift({
      content: content,
      title: d.title || '商品',
      price: d.finalPrice != null ? money(d.finalPrice) : '',
      time: Date.now()
    });
    saveHistory(list);
    renderHistory();
  }

  function renderHistory() {
    var list = loadHistory();
    if (!list.length) { $historyCard.classList.add('hidden'); return; }
    $historyCard.classList.remove('hidden');
    $historyList.innerHTML = list.map(function (item, index) {
      var date = new Date(item.time);
      var time = (date.getMonth() + 1) + '-' + date.getDate() + ' '
        + ('0' + date.getHours()).slice(-2) + ':' + ('0' + date.getMinutes()).slice(-2);
      return '<div class="history-item" data-index="' + index + '">'
        + '<div style="min-width:0">'
        +   '<div class="h-title">' + escapeHtml(item.title) + '</div>'
        +   '<div class="h-time">' + time + '</div>'
        + '</div>'
        + '<div class="h-price">' + (item.price ? '¥' + escapeHtml(item.price) : '') + '</div>'
        + '</div>';
    }).join('');
  }

  $historyList.addEventListener('click', function (e) {
    var item = e.target.closest('.history-item');
    if (!item) return;
    var record = loadHistory()[Number(item.getAttribute('data-index'))];
    if (!record) return;
    $content.value = record.content;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    convert();
  });

  $convertBtn.addEventListener('click', convert);
  $content.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') convert();
  });

  document.getElementById('pasteBtn').addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (text) {
        if (!text) { toast('剪贴板是空的'); return; }
        $content.value = text;
        toast('已粘贴，点击转换');
      }).catch(function () {
        toast('浏览器不允许读取剪贴板，请长按输入框粘贴');
      });
    } else {
      toast('请长按输入框粘贴');
    }
  });

  document.getElementById('clearBtn').addEventListener('click', function () {
    $content.value = '';
    $resultCard.classList.add('hidden');
    $content.focus();
  });

  document.getElementById('clearHistoryBtn').addEventListener('click', function () {
    saveHistory([]);
    renderHistory();
    toast('已清空');
  });

  renderHistory();
})();
</script>
</body>
</html>
